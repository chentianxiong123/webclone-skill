<!-- 语言选择器 + 完整面板（原 .pLdMpdki×2 语言条 + .IcHmn0gj 面板：快捷中EN/快捷语言/搜索/A-Z分组） -->
<div class="hc-langbar">
  <button type="button" class="hc-lang-btn" data-hc-lang="auto" id="hc-src-lang">
    <span>自动检测</span>
    <svg width="13" height="12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9.016 4.5l-3 3-3-3" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button type="button" class="hc-lang-swap" id="hc-lang-swap" title="交换语言">
    <svg width="10" height="10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M.474 4.057h9.052a.475.475 0 00.427-.678.472.472 0 00-.133-.165.475.475 0 00-.1-.095L6.337.753a.475.475 0 00-.673.64.473.473 0 00.128.133L8.06 3.112H.474A.475.475 0 000 3.584a.472.472 0 00.474.473zm9.052 1.886H.474A.475.475 0 000 6.416a.47.47 0 00.18.37.473.473 0 00.1.095l3.382 2.366a.474.474 0 00.74-.468.472.472 0 00-.195-.305L1.94 6.888h7.585A.475.475 0 0010 6.416a.472.472 0 00-.474-.473z" fill="currentColor"/></svg>
  </button>
  <button type="button" class="hc-lang-btn" data-hc-lang="zh" id="hc-dst-lang">
    <span>中文(简体)</span>
    <svg width="13" height="12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9.016 4.5l-3 3-3-3" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <!-- 完整语言面板（原 .IcHmn0gj：900px，快捷中EN + 快捷语言 + 搜索 + A-Z 22组） -->
  <div class="hc-lang-panel" id="hc-lang-panel">
    <!-- 快捷中/EN（原 .VAZLwMV3） -->
    <div class="hc-lang-shortcuts">
      <span class="hc-lang-shortcut is-on" data-lang="zh">中<div class="hc-lang-tip">切换中文语种</div></span>
      <span class="hc-lang-shortcut" data-lang="en">EN<div class="hc-lang-tip">切换英文语种</div></span>
    </div>
    <!-- 快捷语言（原 .ENz4tU2V） -->
    <ol class="hc-lang-quick">
      <li class="hc-lang-quick-item is-sel" data-quick="自动检测">自动检测</li>
      <li class="hc-lang-quick-item" data-quick="中文(简体)">中文(简体)</li>
      <li class="hc-lang-quick-item" data-quick="英语">英语</li>
      <li class="hc-lang-quick-item" data-quick=""></li>
    </ol>
    <!-- 搜索（原 .uZbrwF7X） -->
    <div class="hc-lang-search">
      <div class="hc-lang-search-inner">
        <input type="text" placeholder="搜索语言" class="hc-lang-search-input" id="hc-lang-search">
      </div>
    </div>
    <!-- A-Z 分组滚动区 -->
    <div class="hc-lang-scroll-wrap">
      <div class="hc-lang-scroll" id="hc-lang-groups"></div>
    </div>
  </div>
</div>
