<!-- 右侧竖排 tab（原 .ant-tabs-right：AI Aide / 历史记录，竖排图标切换） -->
<div class="hc-right-tabs">
  <div role="tablist" class="hc-right-tabs-nav">
    <div class="hc-right-tabs-list">
      <div data-node-key="AIAide" class="hc-right-tab hc-right-tab-active">
        <div role="tab" aria-selected="true" class="hc-right-tab-btn" tabindex="0" id="hc-right-tab-aiaide" aria-controls="hc-right-panel-aiaide">
          <span class="hc-right-tab-ic hc-right-tab-ic-ai"></span>
        </div>
      </div>
      <div data-node-key="history" class="hc-right-tab">
        <div role="tab" aria-selected="false" class="hc-right-tab-btn" tabindex="0" id="hc-right-tab-history" aria-controls="hc-right-panel-history">
          <span class="hc-right-tab-ic hc-right-tab-ic-history"></span>
        </div>
      </div>
      <div class="hc-right-tabs-ink"></div>
    </div>
  </div>
</div>
